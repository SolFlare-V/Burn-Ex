    reason: "Product analytics telemetry"
  - name: amplitude-analytics
    reason: "Analytics telemetry to amplitude.com"
  - name: mixpanel
    reason: "Analytics telemetry to mixpanel.com"
  - name: elastic-apm
    reason: "APM telemetry to elastic.co"

